name: Deploy lên GitHub Pages

on:
  push:
    branches: [main]
  # Cho phép chạy tay từ tab Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ một lượt deploy chạy cùng lúc; lượt mới không hủy lượt đang chạy dở
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Chạy kiểm thử
        run: npm test

      # npm run build gồm cả kiểm tra kiểu (tsc) và đóng gói bằng Vite
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
